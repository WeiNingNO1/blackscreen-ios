name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: 编译未签名 ipa
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project BlackScreen.xcodeproj \
            -scheme BlackScreen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/BlackScreen.app"
          test -d "$APP"
          rm -rf Payload BlackScreen.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload BlackScreen.ipa
          ls -lh BlackScreen.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BlackScreen-unsigned-ipa
          path: BlackScreen.ipa
          if-no-files-found: error
